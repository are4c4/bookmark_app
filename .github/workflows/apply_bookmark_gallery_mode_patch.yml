name: Apply Bookmark Gallery mode patch

on:
  push:
    branches:
      - feature/bookmark-gallery-mode-parity-249-refresh

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bookmark-gallery-mode-parity-249-refresh
      - name: Apply focused patch
        run: python3 .github/scripts/apply_bookmark_gallery_mode_patch.py
      - name: Commit focused patch and remove runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply_bookmark_gallery_mode_patch.yml
          git rm .github/scripts/apply_bookmark_gallery_mode_patch.py
          git add lib/views/bookmark_unified_stage1_page.dart test/bookmark_unified_stage1_gallery_mode_test.dart
          git commit -m "Wire Bookmark Gallery to shared fixed/masonry mode [gallery-mode-patch-applied]"
          git push origin HEAD:feature/bookmark-gallery-mode-parity-249-refresh
