name: Repository Settings Audit

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-settings-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-settings-audit:
    name: repository-settings-audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test repository settings audit
        run: python3 tool/repository_settings_audit_test.py

      - name: Audit repository settings read-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tool/repository_settings_audit.py
