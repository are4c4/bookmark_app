name: Flutter CI

on:
  push:
    branches:
      - main
      - feature/database-gallery
      - codex/data-integrity-audit
  pull_request:
    branches:
      - main

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Prepare macOS host project
        run: |
          if [ ! -d macos ]; then
            flutter create --platforms=macos .
          fi

      - name: Build macOS debug app
        run: flutter build macos --debug
