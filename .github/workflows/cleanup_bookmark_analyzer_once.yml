name: Cleanup bookmark analyzer once

on:
  push:
    branches: [refactor/database-ui-architecture-v1]
    paths:
      - '.github/workflows/cleanup_bookmark_analyzer_once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/database-ui-architecture-v1
      - name: Remove obsolete bookmark helpers
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/views/bookmark_unified_stage1_page.dart')
          text = path.read_text()
          text = text.replace("import '../data/saved_view_extensions.dart';\n", '', 1)
          text, n1 = re.subn(
              r"\n  void _resetFilters\(\) \{.*?\n  \}\n\n  void _filterByTag",
              "\n\n  void _filterByTag",
              text,
              count=1,
              flags=re.S,
          )
          if n1 != 1:
              raise SystemExit(f'_resetFilters removal count={n1}')
          text, n2 = re.subn(
              r"\n  String _visiblePropertiesString\(\) => _visiblePropertyTokens\.join\(','\);\n",
              "\n",
              text,
              count=1,
          )
          if n2 != 1:
              raise SystemExit(f'_visiblePropertiesString removal count={n2}')
          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/cleanup_bookmark_analyzer_once.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/views/bookmark_unified_stage1_page.dart .github/workflows/cleanup_bookmark_analyzer_once.yml
          git commit -m 'Remove obsolete bookmark helpers after legacy UI cleanup'
          git push origin HEAD:refactor/database-ui-architecture-v1
