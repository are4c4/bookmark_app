name: Consolidate database UI once

on:
  push:
    branches:
      - 'refactor/database-ui-architecture-v1'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/database-ui-architecture-v1
      - run: python3 tool/consolidate_database_ui.py
      - run: rm tool/consolidate_database_ui.py .github/workflows/consolidate_database_ui_once.yml lib/features/database/presentation/widgets/database_toolbar.dart
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate shared database toolbar and property formatting'
          git push origin HEAD:refactor/database-ui-architecture-v1
