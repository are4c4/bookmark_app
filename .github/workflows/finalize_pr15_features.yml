name: Finalize PR15 features

on:
  push:
    branches:
      - feature/notion-database-foundation-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/notion-database-foundation-v2
      - name: Apply final feature patch
        run: python3 tooling/finalize_pr15_features.py
      - name: Remove one-shot patch files
        run: |
          rm tooling/finalize_pr15_features.py
          rm .github/workflows/finalize_pr15_features.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete generic databases and detail property reordering"
          git push origin HEAD:feature/notion-database-foundation-v2
