name: Patch Bookmark read store

on:
  push:
    branches:
      - refactor/issue-225-bookmark-read-store

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-225-bookmark-read-store
      - name: Apply exact read-store extraction
        run: python3 tool/patch_bookmark_read_store.py
      - name: Remove one-shot tooling
        run: |
          rm tool/patch_bookmark_read_store.py
          rm .github/workflows/patch-bookmark-read-store.yml
      - name: Commit extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Move Bookmark aggregation behind read store'
          git push
