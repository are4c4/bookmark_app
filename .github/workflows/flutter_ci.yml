name: Flutter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: analyze-guards
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Maintainability guardrail tests
        run: |
          bash tool/maintainability_report_test.sh
          bash tool/feature_legacy_dependency_guard_test.sh
          bash tool/feature_presentation_error_privacy_guard_test.sh

      - name: Maintainability regression ceilings
        run: >-
          bash tool/maintainability_report.sh
          --max-boundary-refs 9
          --max-feature-presentation-db-imports 4
          --max-legacy-shim-imports 0
          --max-legacy-shims 0

      - name: Feature legacy dependency guard
        run: bash tool/feature_legacy_dependency_guard.sh

      - name: Feature presentation error privacy guard
        run: bash tool/feature_presentation_error_privacy_guard.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

  test:
    name: test-shard-${{ matrix.shard }}-of-3
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Test shard ${{ matrix.shard }} of 3
        id: flutter-test
        timeout-minutes: 18
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          flutter test \
            --timeout 2m \
            --reporter expanded \
            --total-shards 3 \
            --shard-index ${{ matrix.shard }} \
            2>&1 | tee ci-artifacts/flutter-test-shard-${{ matrix.shard }}.log

      - name: Summarize Flutter test failure
        if: ${{ failure() && steps.flutter-test.outcome == 'failure' }}
        run: |
          {
            echo '## Flutter Test shard ${{ matrix.shard }} of 3 failure'
            echo
            echo 'Last 200 log lines:'
            echo
            echo '```text'
            tail -n 200 ci-artifacts/flutter-test-shard-${{ matrix.shard }}.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Flutter test diagnostics
        if: ${{ failure() && steps.flutter-test.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ci-artifacts/flutter-test-shard-${{ matrix.shard }}.log
          if-no-files-found: warn
          retention-days: 7

  build-macos:
    name: build-macos-release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS release app and DMG
        run: bash tool/package_macos.sh

      - name: Upload macOS release package
        uses: actions/upload-artifact@v4
        with:
          name: Bookmark-macOS
          if-no-files-found: error
          path: |
            build/macos/Build/Products/Release/Bookmark.app
            dist/macos/Bookmark-*.dmg
