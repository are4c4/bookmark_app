name: Fix v5 photo migration

on:
  push:
    branches:
      - refactor/issue-225-migration-v5-regression

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/issue-225-migration-v5-regression
      - name: Apply compatibility patch
        run: python3 tool/fix_v5_photo_migration.py
      - name: Remove one-shot files
        run: rm tool/fix_v5_photo_migration.py .github/workflows/fix_v5_photo_migration.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Guard existing photo tags during v7 migration"
          git push origin HEAD:refactor/issue-225-migration-v5-regression
