name: Extract v7 migration

on:
  push:
    branches:
      - refactor/issue-225-migration-v7-extraction

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/issue-225-migration-v7-extraction
      - name: Extract v7 migration body
        run: python3 tool/extract_v7_migration.py
      - name: Remove one-shot files
        run: rm tool/extract_v7_migration.py .github/workflows/extract_v7_migration.yml
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire extracted v7 migration step"
          git push origin HEAD:refactor/issue-225-migration-v7-extraction
