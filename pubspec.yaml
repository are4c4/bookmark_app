name: bookmark_app
description: A Flutter bookmark manager with database-backed multiple views.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  file_selector: ^1.0.3
  http: ^1.5.0
  html: ^0.15.6
  url_launcher: ^6.3.2
  flutter_staggered_grid_view: ^0.7.0
  desktop_drop: ^0.8.2
  pdfrx: ^1.1.24
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.2
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
