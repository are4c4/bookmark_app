name: Apply Notion UI source patch

on:
  push:
    branches:
      - feature/notion-database-foundation-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/notion-database-foundation-v2
      - name: Apply source patch
        run: python3 tooling/notion_branch_patch.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/views/bookmark_unified_stage1_page.dart
          git commit -m "Polish bookmark list metadata and inline creation"
          git push origin HEAD:feature/notion-database-foundation-v2
