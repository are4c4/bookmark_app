name: Repository Settings Audit

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '23 18 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-settings-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-settings-audit:
    name: repository-settings-audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test repository settings contract
        run: python3 tool/repository_settings_guard_test.py

      - name: Audit live repository settings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tool/repository_settings_guard.py
