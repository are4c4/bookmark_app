name: PR15 analyze cleanup

on:
  push:
    branches:
      - feature/notion-database-foundation-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/notion-database-foundation-v2
      - name: Apply cleanup
        run: python3 tooling/pr15_analyze_cleanup.py
      - name: Remove one-shot files
        run: |
          rm tooling/pr15_analyze_cleanup.py
          rm .github/workflows/pr15_analyze_cleanup.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean final analyzer warnings"
          git push origin HEAD:feature/notion-database-foundation-v2
