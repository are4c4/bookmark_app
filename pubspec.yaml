publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.28.1
  drift_flutter: ^0.2.5
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  drift_dev: ^2.28.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
