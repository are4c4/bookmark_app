name: Performance Benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Synthetic benchmark profile
        required: true
        type: choice
        default: medium
        options:
          - small
          - medium
          - large
  schedule:
    - cron: '43 3 * * 3'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/performance_benchmark.yml'
      - 'tool/performance_benchmark.dart'
      - 'tool/performance_benchmark_variance.dart'
      - 'test/performance_benchmark_smoke_test.dart'
      - 'test/performance_benchmark_variance_test.dart'
      - 'docs/PERFORMANCE_BENCHMARKS.md'

permissions:
  contents: read

concurrency:
  group: performance-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: advisory-performance-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BENCHMARK_OUTPUT_DIR: build/performance
      BENCHMARK_PROFILE_INPUT: ${{ inputs.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select benchmark profile and repetitions
        shell: bash
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              profile='small'
              repetitions='2'
              ;;
            schedule)
              profile='large'
              repetitions='3'
              ;;
            *)
              profile="${BENCHMARK_PROFILE_INPUT:-medium}"
              repetitions='3'
              ;;
          esac
          echo "BENCHMARK_PROFILE=$profile" >> "$GITHUB_ENV"
          echo "BENCHMARK_REPETITIONS=$repetitions" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run repeated deterministic advisory benchmark
        shell: bash
        env:
          PERFORMANCE_BENCHMARK_PROFILE: ${{ env.BENCHMARK_PROFILE }}
          PERFORMANCE_BENCHMARK_SOURCE_SHA: ${{ github.sha }}
          PERFORMANCE_BENCHMARK_WARMUPS: '1'
          PERFORMANCE_BENCHMARK_SAMPLES: '5'
        run: |
          set -euo pipefail
          mkdir -p "$BENCHMARK_OUTPUT_DIR/runs"
          inputs=()
          for index in $(seq 1 "$BENCHMARK_REPETITIONS"); do
            run_dir="$BENCHMARK_OUTPUT_DIR/runs/run-$index"
            mkdir -p "$run_dir"
            PERFORMANCE_BENCHMARK_JSON_PATH="$run_dir/report.json" \
            PERFORMANCE_BENCHMARK_MARKDOWN_PATH="$run_dir/summary.md" \
              flutter test test/performance_benchmark_smoke_test.dart --reporter=expanded
            inputs+=("--input=$run_dir/report.json")
          done
          dart run tool/performance_benchmark_variance.dart \
            "${inputs[@]}" \
            --json="$BENCHMARK_OUTPUT_DIR/variance.json" \
            --markdown="$BENCHMARK_OUTPUT_DIR/variance.md"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-benchmark-${{ github.sha }}-${{ env.BENCHMARK_PROFILE }}
          path: build/performance
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize benchmark
        if: always()
        run: |
          if [[ -f "$BENCHMARK_OUTPUT_DIR/variance.md" ]]; then
            cat "$BENCHMARK_OUTPUT_DIR/variance.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '# Performance benchmark unavailable'
              echo
              echo "- Source SHA: \`${GITHUB_SHA}\`"
              echo "- Requested profile: \`${BENCHMARK_PROFILE}\`"
              echo '- Inspect workflow logs and any uploaded artifact before drawing a performance conclusion.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo
            echo '- Policy: this repeated-run benchmark is advisory and is not a required merge gate.'
            echo '- Pull requests use 2 small repetitions to validate aggregation; scheduled runs use 3 large repetitions; manual runs use 3 repetitions of the selected profile.'
            echo '- Variance aggregation fails closed if source/profile/runtime/fixture/scenario provenance differs across repetitions.'
          } >> "$GITHUB_STEP_SUMMARY"
