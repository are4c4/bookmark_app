name: UI Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ui_audit.yml'
      - 'test/ui_audit_snapshot_test.dart'
      - 'tool/ui_audit_report.py'
      - 'tool/ui_audit_report_test.py'
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ui_audit.yml'
      - 'tool/ui_audit_report.py'
      - 'tool/ui_audit_report_test.py'

permissions:
  contents: read

concurrency:
  group: ui-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshots:
    name: advisory-ui-snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify H review input generator
        run: python3 tool/ui_audit_report_test.py

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare deterministic Japanese audit font
        shell: bash
        run: |
          set -euo pipefail
          font_path="$RUNNER_TEMP/NotoSansJP-VF.otf"
          font_url='https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/Variable/OTF/Subset/NotoSansJP-VF.otf'
          expected_blob='36864f7e1f1a3f51e4972e4e37aaa15467649760'
          expected_size='8128756'

          curl --fail --location --silent --show-error \
            --output "$font_path" \
            "$font_url"

          actual_size="$(wc -c < "$font_path" | tr -d ' ')"
          actual_blob="$(git hash-object "$font_path")"
          if [[ "$actual_size" != "$expected_size" ]]; then
            echo "UI Audit font size mismatch: expected $expected_size, got $actual_size" >&2
            exit 1
          fi
          if [[ "$actual_blob" != "$expected_blob" ]]; then
            echo "UI Audit font blob mismatch: expected $expected_blob, got $actual_blob" >&2
            exit 1
          fi

          echo "UI_AUDIT_FONT_PATH=$font_path" >> "$GITHUB_ENV"

      - name: Capture deterministic UI audit surfaces
        id: capture
        shell: bash
        env:
          UI_AUDIT_OUTPUT_DIR: build/ui_audit
          UI_AUDIT_SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$UI_AUDIT_OUTPUT_DIR"
          set +e
          set -o pipefail
          flutter test test/ui_audit_snapshot_test.dart --concurrency=1 --reporter=expanded \
            2>&1 | tee "$UI_AUDIT_OUTPUT_DIR/test.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$UI_AUDIT_OUTPUT_DIR/test-exit-code.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -ne 0 ]]; then
            echo "::warning::UI audit capture reported deterministic test failures; this advisory workflow does not replace required Flutter CI."
          fi

      - name: Build H UI audit review input
        if: always()
        run: python3 tool/ui_audit_report.py build/ui_audit

      - name: Upload UI audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-audit-${{ github.sha }}
          path: build/ui_audit
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize UI audit
        if: always()
        run: |
          if [[ -f build/ui_audit/h-review-input.md ]]; then
            cat build/ui_audit/h-review-input.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## UI audit review input unavailable'
              echo
              echo "- Source SHA: \`${GITHUB_SHA}\`"
              echo '- Evidence bundle did not produce `h-review-input.md`; inspect uploaded artifact/logs before drawing a UX conclusion.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo
            echo '- Policy: screenshot evidence and H review are advisory; deterministic behavior remains enforced by normal Flutter CI.'
            echo '- Artifact retention: 14 days.'
          } >> "$GITHUB_STEP_SUMMARY"
