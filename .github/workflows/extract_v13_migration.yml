name: Extract v13 migration

on:
  push:
    branches:
      - refactor/issue-225-migration-v13-extraction
    paths:
      - tool/extract_v13_migration.py
      - .github/workflows/extract_v13_migration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/issue-225-migration-v13-extraction
          fetch-depth: 0
      - name: Extract v13 migration call
        run: python3 tool/extract_v13_migration.py
      - name: Remove one-shot patch files
        run: rm -f tool/extract_v13_migration.py .github/workflows/extract_v13_migration.yml
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Wire extracted v13 migration step"
          git push origin HEAD:refactor/issue-225-migration-v13-extraction
