include: package:flutter_lints/flutter.yaml

# Flutter's maintained lint set is the baseline. The rules below are inherited
# debt that existed before the baseline was activated. Keep them explicit so
# focused refactor PRs can remove one ignore at a time instead of hiding the
# whole lint policy or forcing broad unrelated churn.
analyzer:
  errors:
    avoid_print: ignore
    curly_braces_in_flow_control_structures: ignore
    prefer_function_declarations_over_variables: ignore
    prefer_initializing_formals: ignore
    unnecessary_brace_in_string_interps: ignore
    unnecessary_underscores: ignore
    use_build_context_synchronously: ignore
    use_null_aware_elements: ignore
    use_super_parameters: ignore
