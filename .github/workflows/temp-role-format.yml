name: Temporary role formatter

on:
  push:
    branches:
      - feature/bookmark-weblink-person-roles-1186

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/bookmark-weblink-person-roles-1186
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Fix focused watcher fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/object_sync_weblink_person_role_convergence_test.dart')
          text = path.read_text(encoding='utf-8')
          marker = "    'watcher-driven legacy role change reports exact Weblink impact',"
          start = text.index(marker)
          end_marker = "\n  );\n}\n\nFuture<void> _waitUntil"
          end = text.index(end_marker, start)
          block = text[start:end]
          bootstrap = "      await fixture.sync.syncWorkspace(fixture.workspaceId);\n      notifications.clear();"
          replacement = "      await fixture.sync.syncWorkspace(fixture.workspaceId);\n      final weblinkObjectId = (await fixture.weblinks()).single.id;\n      notifications.clear();"
          if block.count(bootstrap) != 1:
              raise SystemExit('watcher bootstrap marker mismatch')
          block = block.replace(bootstrap, replacement, 1)
          block = block.replace('fixture.weblinkObjectId', 'weblinkObjectId')
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format changed Dart
        shell: bash
        run: |
          dart format \
            lib/data/bookmark_weblink_person_role_convergence_service.dart \
            lib/services/object_sync_service.dart \
            test/object_sync_weblink_person_role_convergence_test.dart
      - name: Commit focused fix and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/temp-role-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: stabilize and format Person role convergence'
          git push origin HEAD:feature/bookmark-weblink-person-roles-1186
