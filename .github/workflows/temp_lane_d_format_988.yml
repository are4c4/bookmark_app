name: Temporary Lane D formatter

on:
  push:
    branches:
      - feature/primitives-hide-legacy-photos-nav-245

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/primitives-hide-legacy-photos-nav-245
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format changed Dart files
        run: dart format lib/views/app_shell.dart test/legacy_photo_navigation_retirement_test.dart
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/views/app_shell.dart test/legacy_photo_navigation_retirement_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format legacy Photos navigation retirement"
          git push origin HEAD:feature/primitives-hide-legacy-photos-nav-245
