name: Apply Notion refresh patch

on:
  push:
    branches:
      - feature/notion-ui-refresh

permissions:
  contents: write

concurrency:
  group: apply-notion-refresh-patch
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ui-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/notion-ui-refresh

      - name: Apply source patch
        run: python3 tool/apply_notion_refresh_patch.py

      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/views/bookmark_unified_stage1_page.dart lib/views/tag_management_page.dart
          git commit -m "[ui-patch] Apply Notion refresh patch"
          git push origin HEAD:feature/notion-ui-refresh
