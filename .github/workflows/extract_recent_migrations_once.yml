name: Extract recent migrations once

on:
  push:
    branches:
      - 'refactor/database-ui-architecture-v1'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/database-ui-architecture-v1
      - run: python3 tool/extract_recent_migrations.py
      - run: rm tool/extract_recent_migrations.py .github/workflows/extract_recent_migrations_once.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract v15 and v16 migration steps'
          git push origin HEAD:refactor/database-ui-architecture-v1
